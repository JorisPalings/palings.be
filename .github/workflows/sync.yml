name: Sync catalogus vanaf Claude Artifact
 
# Haalt de publieke Claude Artifact-URL op en committed die als index.html
# zodra de inhoud gewijzigd is. GitHub Pages herbouwt daarna vanzelf.
#
# Eenmalige instelling die nodig is:
#  1. Deel de Claude Artifact publiek (Share-knop op de artifact-pagina)
#     en kopieer de publieke link.
#  2. Vervang ARTIFACT_URL hieronder door die link.
#
# Daarna: geen handmatige upload meer nodig. Deze workflow draait
# vanzelf elke 15 minuten, of druk zelf op "Run workflow" in de
# Actions-tab voor een directe sync.
 
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
 
permissions:
  contents: write
 
env:
  ARTIFACT_URL: "https://claude.ai/code/artifact/5291e29d-922d-42fe-9177-1adb1acd5e67"
 
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Download laatste versie van de Artifact
        run: |
          curl -sSL -A "Mozilla/5.0" "$ARTIFACT_URL" -o index.html.new
          # sanity-check: bestand moet bestaan en er echt uitzien als de
          # catalogus-pagina, niet een lege/foutpagina
          test -s index.html.new
          grep -qi "TOOL_DATA" index.html.new
 
      - name: Committen als er iets veranderd is
        run: |
          if ! cmp -s index.html.new index.html; then
            mv index.html.new index.html
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Automatische sync vanaf Claude Artifact"
            git push
          else
            echo "Geen wijzigingen sinds vorige sync."
            rm -f index.html.new
          fi
 
